# ============================================================================
# TARGET COMPANY REGISTRY
# ----------------------------------------------------------------------------
# This is the most valuable file in the repo. It is the list of companies whose
# careers pages you watch directly — the roles that never reach LinkedIn or
# Naukri. Getting this to 40-60 entries is the single highest-ROI hour of work
# in Phase 0.
#
# HOW TO ADD A COMPANY
#   1. Open the company's careers page and click any job.
#   2. Copy the URL you land on.
#   3. Run:  pnpm cli detect "<that url>"
#   4. Paste the reported ats + token here.
#   5. Run:  pnpm cli verify     (checks every entry actually returns jobs)
#
# FIELDS
#   name       Display name.
#   ats        greenhouse | lever | ashby | workday | smartrecruiters
#   token      Board token from `detect`.
#   signal     Optional reputation nudge, -5..+5. Reserved for scoring.
#   tags       Free-form. Useful ones: india, remote-india, remote-global, product, fintech
#   enabled    Set false to keep an entry on file without fetching it.
# ============================================================================

companies:
  # --- verified working as of 2026-08-24 ---
  - name: Stripe
    ats: greenhouse
    token: stripe
    careersUrl: https://stripe.com/jobs/search
    signal: 4
    tags: [product, fintech, remote-global]

  - name: Postman
    ats: greenhouse
    token: postman
    careersUrl: https://www.postman.com/company/careers/
    signal: 3
    tags: [india, product, remote-india]

  - name: Grafana Labs
    ats: greenhouse
    token: grafanalabs
    careersUrl: https://grafana.com/about/careers/
    signal: 3
    tags: [remote-global, product, oss]

  - name: OpenAI
    ats: ashby
    token: openai
    careersUrl: https://openai.com/careers/
    signal: 5
    tags: [product, ai]

  - name: Palantir
    ats: lever
    token: palantir
    careersUrl: https://www.palantir.com/careers/
    signal: 3
    tags: [product]

  - name: Vercel
    ats: ashby
    token: vercel
    careersUrl: https://vercel.com/careers
    signal: 4
    tags: [remote-global, product, frontend]

