<html><body><script>AF_initDataCallback({key: 'ds:1', hash: '2', data:[[["131666108921848518", "Software Engineer Manager, Engineering Productivity, Google One and Photos", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckQ1oylBas_c2QNi-no2QxXIyFqU9EwMItsWzEv7_TPaMEjsA9yzvgpM7NdjxBfdwT71W0WQ-Z9JsQ96sxXYdtqLWP6JkxyzmAVSiw32JhhYp1gzCvxs8HavP8_q_bA%3D%3D_V2&loc=IN&title=Software+Engineer+Manager", [null, "<ul>\n<li>Set and communicate team priorities that support the broader organization's goals. Align strategy, processes, and decision-making across teams.<br></li>\n<li>Set clear expectations with individuals based on their level and role and aligned to the broader organization's goals. Meet regularly with individuals to discuss performance and development and provide feedback and coaching.<br></li>\n<li>Develop the mid-term technical goal and roadmap within the scope of the multiple teams. Evolve the roadmap to meet anticipated future requirements and infrastructure needs.</li>\n<li>Design, guide and vet systems designs within the scope of the broader area, and write product or system development code to solve ambiguous problems.<br></li>\n<li>Review code developed by other engineers and provide feedback to ensure best practices (e.g., style guidelines, checking code in, accuracy, testability, and efficiency).<br></li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>8 years of experience in software development.<br></li>\n<li>3 years of experience building developer tools (e.g., compilers, automated releases, code design and testing, test automation frameworks).</li>\n<li>3 years of experience in a technical leadership role.</li>\n<li>2 years of experience in a people management or team leadership role.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Master's degree or PhD in Computer Science or related technical field.<br></li>\n<li>3 years of experience working in a complex, matrixed organization.<br></li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Bengaluru, Karnataka, India", ["216, 6th Main Rd, Kamadhenu Nagar, B Narayanapura, Mahadevapura, Bengaluru, Karnataka 560016, India"], "Bengaluru", "560016", "KA", "IN"]], [null, "Like Google's own ambitions, the work of a Software Engineer goes beyond just Search. Software Engineering Managers have not only the technical expertise to take on and provide technical leadership to major projects, but also manage a team of Engineers. You not only optimize your own code but make sure Engineers are able to optimize theirs. As a Software Engineering Manager you manage your project goals, contribute to product strategy and help develop your team. Teams work all across the company, in areas such as information retrieval, artificial intelligence, natural language processing, distributed computing, large-scale system design, networking, security, data compression, user interface design; the list goes on and is growing every day. Operating with scale and speed, our exceptional software engineers are just getting started -- and as a manager, you guide the way.<br><br>With technical and leadership expertise, you manage engineers across multiple teams and locations, a large product budget and oversee the deployment of large-scale projects across multiple sites internationally.\n<div>Google One (G1) is Google's membership for personal cloud storage and Google's cutting-edge AI features. G1 is one of Google's fastest growing subscriptions, with over 150 million subscribers. This is a unique opportunity to be part of a high-impact team, shaping the future of our subscriber experiences, premium features and business growth initiatives.</div><b></b>"], [2, 3, 4], [1790860143, 324000000], [1790860143, 324000000], [1790860143, 386000000], [null, "In most instances, this position requires in-person interviews as part of the hiring process."], null, null, [null, ""], [null, "<ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>8 years of experience in software development.<br></li>\n<li>3 years of experience building developer tools (e.g., compilers, automated releases, code design and testing, test automation frameworks).</li>\n<li>3 years of experience in a technical leadership role.</li>\n<li>2 years of experience in a people management or team leadership role.</li>\n</ul>"], 3], ["128780495415583430", "Software Engineer, EngProd, Google One and Google Photos", "https://www.google.com/about/careers/applications/signin?jobId=CiUAL2FckVnToDq95heDYF8N0D1Iy2g7MOBpV8gY_7k1hRMwb2atEjsA1Ny_iy_HeTle2tYCdN1_0DKJmxnGIZLpPHadm_YxBMfJyzZGGN-rDyVisslebWOfpCl8_ShND-551Q%3D%3D_V2&loc=IN&title=Software+Engineer", [null, "<ul>\n<li>Foster a culture of collaboration and partnership by working closely with engineering teams across Google One and Photos to ensure seamless execution and alignment with our objectives.</li>\n<li>Work closely with teams spanning several time zones (located in Mountain View, Los Angeles, New York, Bengaluru, and Sydney).</li>\n<li>Provide expert technical guidance and mentorship to team members, nurturing their growth, and empowering them in their roles.</li>\n<li>Communicate effectively with stakeholders at all levels, articulating technical concepts, and influencing decisions to drive the success of projects.</li>\n<li>Contribute to the Engineering Productivity (EngProd) community by sharing insights, presenting at conferences, and staying updated on emerging technologies.</li>\n</ul>"], [null, "<h3>Minimum qualifications:</h3><ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>8 years of experience with software development.</li>\n<li>5 years of experience with Android or iOS application development.</li>\n</ul><br><h3>Preferred qualifications:</h3><ul>\n<li>Experience with tools and infrastructure development to optimize the software engineering process and passion for engineering excellence.</li>\n<li>Experience adopting developer AI tools to optimize software engineering productivity and drive technical impact at scale.</li>\n</ul>"], "projects/gweb-careers-proto/tenants/60107626-8e00-0000-0000-0071646e0806/companies/ebbbf0d1-8121-483c-8f99-ee92597591fc", null, "Google", "en-US", [["Bengaluru, Karnataka, India", ["3, Old Madras Rd, Sadanandanagar, Bennigana Halli, Bengaluru, Karnataka 560038, India"], "Bengaluru", "560038", "KA", "IN"]], [null, "<p>Google's software engineers develop the next-generation technologies that change how billions of users connect, explore, and interact with information and one another. Our products need to handle information at massive scale, and extend well beyond web search. We're looking for engineers who bring fresh ideas from all areas, including information retrieval, distributed computing, large-scale system design, networking and data storage, security, artificial intelligence, natural language processing, UI design and mobile; the list goes on and is growing every day. As a software engineer, you will work on a specific project critical to Google\u2019s needs with opportunities to switch teams and projects as you and our fast-paced business grow and evolve. We need our engineers to be versatile, display leadership qualities and be enthusiastic to take on new problems across the full-stack as we continue to push technology forward.<br><br>With your technical expertise you will manage project priorities, deadlines, and deliverables. You will design, develop, test, deploy, maintain, and enhance software solutions.</p><p>The Platforms and Devices team encompasses Google's various computing software platforms across environments (desktop, mobile, applications), as well as our first party devices and services that combine the best of Google AI, software, and hardware. Teams across this area research, design, and develop new technologies to make our user's interaction with computing faster and more seamless, building innovative experiences for our users around the world.<br><b></b></p>"], [2], [1788953911, 497000000], [1788953911, 497000000], [1788953911, 552000000], [null, "In most instances, this position requires in-person interviews as part of the hiring process."], null, null, [null, ""], [null, "<ul>\n<li>Bachelor's degree or equivalent practical experience.</li>\n<li>8 years of experience with software development.</li>\n<li>5 years of experience with Android or iOS application development.</li>\n</ul>"], 3]], null, 151, 20], sideChannel: {}});</script></body></html>
